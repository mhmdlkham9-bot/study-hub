<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semester Study Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..850&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eef1f4; --sheet:#ffffff; --ink:#1c2633; --ink2:#46566a; --mute:#7b8898; --rule:#d9dfe6; --well:#f4f6f8;
  --steel:#1c2633; --hazard:#f2b705; --go:#2e8b57; --stop:#c8372d;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11161d; --sheet:#18202a; --ink:#e8edf2; --ink2:#b4c0cc; --mute:#8593a3; --rule:#2a3542; --well:#1f2833; --steel:#0b0f14;}}
:root[data-theme="dark"]{--paper:#11161d; --sheet:#18202a; --ink:#e8edf2; --ink2:#b4c0cc; --mute:#8593a3; --rule:#2a3542; --well:#1f2833; --steel:#0b0f14;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--paper);color:var(--ink);font-family:"Archivo",-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;font-variation-settings:"wdth" 100}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--hazard);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}

/* ===== header + production timeline (the one bold element) ===== */
header{background:var(--steel);color:#fff;position:sticky;top:0;z-index:20}
.hrow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:16px 0 10px}
.title{font-weight:800;font-size:22px;line-height:1;font-variation-settings:"wdth" 75;letter-spacing:.2px}
.who{color:#9fb0c3;font-size:13.5px;margin-top:4px}
.count{text-align:right}
.count b{display:block;font-size:30px;line-height:1;font-weight:850;font-variation-settings:"wdth" 70;color:var(--hazard)}
.count span{font-size:12.5px;color:#9fb0c3}
.ribbon{display:grid;grid-template-columns:repeat(39,1fr);gap:2px;padding:0 0 12px}
.tick{height:26px;border-radius:2px;background:#2d3a4a;position:relative}
.tick.done{background:#4f7d68}
.tick.ex{background:repeating-linear-gradient(135deg,var(--hazard) 0 4px,#1c2633 4px 8px)}
.tick.ex.done{opacity:.55}
.tick.cur{box-shadow:0 0 0 2px #fff inset}
.tick.today::after{content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);border:5px solid transparent;border-bottom-color:var(--hazard)}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav a{padding:10px 14px 12px;color:#9fb0c3;font-weight:600;font-size:15px;text-decoration:none;white-space:nowrap;border-radius:8px 8px 0 0}
nav a.on{background:var(--paper);color:var(--ink)}
nav a[hidden]{display:none}
.tbtn{color:#9fb0c3;font-size:13px;border:1px solid #33414f;border-radius:7px;padding:5px 9px;margin-left:auto;align-self:center}

main{padding:22px 0 64px}
.view{display:none}.view.on{display:block}
h2{font-size:28px;font-weight:800;line-height:1.1;font-variation-settings:"wdth" 80}
.lede{color:var(--ink2);margin-top:4px;max-width:62ch}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 16px;border-radius:9px;background:var(--well);border:1px solid var(--rule);font-weight:700}
.btn.go{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.chip{display:inline-block;font-weight:700;font-size:12.5px;color:#fff;border-radius:5px;padding:2px 8px}

/* ===== work order (today) ===== */
.wo{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.wohead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px dashed var(--rule)}
.wodate{font-size:26px;font-weight:800;line-height:1.05;font-variation-settings:"wdth" 78}
.wosub{color:var(--mute);font-size:14px}
.nav2{display:flex;gap:6px}
.notice{padding:12px 18px;font-weight:600;border-bottom:1px dashed var(--rule);background:var(--well)}
.notice.ex{background:repeating-linear-gradient(135deg,rgba(242,183,5,.18) 0 10px,transparent 10px 20px);color:var(--ink)}
.op{display:grid;grid-template-columns:6px 1fr;border-bottom:1px solid var(--rule)}
.op:last-child{border-bottom:none}
.op .bar{background:var(--c)}
.opin{padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
.opin h3{font-size:19px;font-weight:750;line-height:1.25;margin:6px 0 2px;font-variation-settings:"wdth" 90}
.extra{color:var(--ink2);font-size:14.5px}
.how{margin:10px 0 0 18px;color:var(--ink2);font-size:14.5px}.how li+li{margin-top:2px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.check{width:44px;height:44px;border-radius:10px;border:2px solid var(--rule);display:grid;place-items:center;font-weight:800;font-size:20px;color:transparent;transition:background .15s}
.check.on{background:var(--go);border-color:var(--go);color:#fff}
.op.isdone h3{color:var(--mute);text-decoration:line-through;text-decoration-thickness:1.5px}
.wait{color:var(--mute);font-size:14px;font-weight:600;align-self:center}

/* ===== plan ===== */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:16px}
.cal .h{font-size:12.5px;font-weight:700;color:var(--mute);text-align:center}
.cd{background:var(--sheet);border:1px solid var(--rule);border-radius:9px;min-height:74px;padding:6px 7px;text-align:left;display:flex;flex-direction:column;gap:4px}
.cd b{font-size:16px;font-weight:800;font-variation-settings:"wdth" 80}
.cd.off{background:transparent;border-style:dashed;opacity:.5}
.cd.ex{background:repeating-linear-gradient(135deg,rgba(242,183,5,.22) 0 8px,var(--sheet) 8px 16px)}
.cd.today{box-shadow:0 0 0 2px var(--ink) inset}
.cd.done{background:color-mix(in srgb,var(--go) 16%,var(--sheet))}
.cd .dots{display:flex;gap:3px;flex-wrap:wrap}.cd .dots i{width:10px;height:10px;border-radius:3px}
.cd small{font-size:11px;font-weight:700;line-height:1.15}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:14px;color:var(--ink2)}
.legend span{display:inline-flex;gap:6px;align-items:center}.legend i{width:12px;height:12px;border-radius:3px}
.phases{margin-top:18px;background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:16px 18px}
.phases ol{margin-left:18px;color:var(--ink2)}.phases li+li{margin-top:4px}

/* ===== courses ===== */
.clist{margin-top:16px;display:grid;gap:12px}
.course{background:var(--sheet);border:1px solid var(--rule);border-left:6px solid var(--c);border-radius:12px;padding:16px 18px;text-align:left;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;width:100%}
.course h3{font-size:20px;font-weight:800;font-variation-settings:"wdth" 85}
.meter{height:6px;background:var(--well);border-radius:9px;overflow:hidden;margin-top:10px}.meter i{display:block;height:100%;background:var(--c)}
.big{font-size:28px;font-weight:850;font-variation-settings:"wdth" 70;color:var(--c);text-align:right;line-height:1}
.big small{display:block;font-size:12px;color:var(--mute);font-weight:600}
.units{margin-top:16px;background:var(--sheet);border:1px solid var(--rule);border-radius:12px}
.unit{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--rule)}
.unit:first-child{border-top:none}
.unit .n{color:var(--mute);font-weight:700;margin-right:8px;font-variant-numeric:tabular-nums}

/* ===== exams ===== */
.ex-row{display:grid;grid-template-columns:70px 1fr auto;gap:14px;align-items:center;padding:14px 18px;border-top:1px solid var(--rule)}
.ex-row:first-child{border-top:none}
.dateblk{text-align:center;border-radius:9px;padding:6px 0;background:var(--well)}
.dateblk b{display:block;font-size:26px;line-height:1;font-weight:850;font-variation-settings:"wdth" 70}
.dateblk span{font-size:12px;color:var(--mute);font-weight:700}

/* ===== admin ===== */
.member{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;margin-top:12px}
.member h3{font-size:17px;font-weight:750}
.toggles{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tg{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 12px;border-radius:999px;border:1px solid var(--rule);background:var(--well);font-weight:600;font-size:14px}
.tg .sw{width:30px;height:18px;border-radius:9px;background:var(--rule);position:relative;transition:background .15s}
.tg .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
.tg.on .sw{background:var(--go)}.tg.on .sw::after{left:14px}
.empty{background:var(--sheet);border:1px dashed var(--rule);border-radius:12px;padding:18px;margin-top:14px;color:var(--ink2)}
.status{font-size:13.5px;color:var(--mute);margin-top:6px}

/* ===== viewer ===== */
.viewer{position:fixed;inset:0;background:rgba(10,14,19,.96);z-index:60;display:none;flex-direction:column}
.viewer.on{display:flex}
.vbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;color:#fff}
.vbar b{font-size:15px;font-weight:700}
.vbtn{color:#fff;border:1px solid #3a4756;border-radius:9px;padding:8px 13px;font-weight:700;min-height:42px}
.vimg{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:0 10px 30px}
.vimg img{display:block;width:100%;height:auto;border-radius:6px;background:#fff;margin:0 auto 12px}
.vimg img{min-height:40vh}.vimg.z2 img{width:200%;max-width:none}.vimg.z3 img{width:300%;max-width:none}
/* ===== gate (own sign-in) ===== */
body.locked header,body.locked main{display:none}
.gate{display:none;min-height:100vh;background:var(--steel);color:#fff;place-items:center;padding:28px 16px}
body.locked .gate{display:grid}
.gbox{width:100%;max-width:400px}
.mark{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.mono{width:62px;height:62px;border-radius:10px;background:var(--hazard);color:var(--steel);display:grid;place-items:center;font-weight:850;font-size:27px;font-variation-settings:"wdth" 70;letter-spacing:-.5px;position:relative;overflow:hidden}
.mono::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:repeating-linear-gradient(135deg,var(--steel) 0 4px,var(--hazard) 4px 8px)}
.mark h1{font-size:28px;font-weight:850;line-height:1;font-variation-settings:"wdth" 75}
.mark p{color:#9fb0c3;font-size:14px;margin-top:5px}
.gcard{background:#232f3e;border:1px solid #33414f;border-radius:14px;padding:20px}
.gcard h2{font-size:21px;color:#fff}
.gcard .lede{color:#b4c0cc;font-size:14.5px}
.fld{display:block;margin-top:14px}
.fld span{display:block;font-size:13.5px;font-weight:650;color:#b4c0cc;margin-bottom:5px}
.fld input,.fld textarea,.ain{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:9px;border:1px solid #3a4756;background:#131a23;color:#fff}
.fld textarea{min-height:92px;font-size:13px;font-family:ui-monospace,Menlo,monospace;resize:vertical}
.gbtn{width:100%;margin-top:18px;min-height:46px;border-radius:9px;background:var(--hazard);color:var(--steel);font-weight:800;font-size:16px}
.glinks{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:16px}
.glinks button{color:#9fb0c3;font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px;min-height:36px}
.gerr{margin-top:12px;color:#ffb4ab;font-size:14px;font-weight:600;min-height:1em}
.gok{color:#9be0b6}
.gnote{color:#7b8898;font-size:12.5px;margin-top:18px;text-align:center}
/* admin forms */
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:16px;margin-top:14px}
.panel h3{font-size:18px;font-weight:800}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.afld{display:block;margin-top:10px}.afld span{display:block;font-size:13px;font-weight:650;color:var(--ink2);margin-bottom:4px}
.ain{background:var(--well);color:var(--ink);border-color:var(--rule)}
.code{margin-top:10px;font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all;background:var(--well);border:1px dashed var(--rule);border-radius:8px;padding:10px;user-select:all}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.btn.red{color:var(--stop)}
.flag{display:inline-block;font-size:12px;font-weight:700;color:#7a5a00;background:rgba(242,183,5,.25);border-radius:5px;padding:1px 7px;margin-left:6px}
@media (max-width:560px){.row2{grid-template-columns:1fr}}
footer{color:var(--mute);font-size:13px;text-align:center;margin-top:34px}
@media (max-width:560px){.ribbon{gap:1px}.tick{height:20px}.title{font-size:19px}.opin{grid-template-columns:1fr}.check{justify-self:start}.cd{min-height:58px;padding:4px}.cd small{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body class="locked">
<div class="gate" id="gate"><div class="gbox">
 <div class="mark"><div class="mono">MM</div><div><h1>Study Hub</h1><p>Mohammed Mansaki · Finals 1448</p></div></div>
 <div class="gcard" id="gcard"></div>
 <p class="gnote">Accounts and progress are kept on this device.</p>
</div></div>
<header><div class="wrap">
  <div class="hrow"><div><div class="title">Semester Study Hub</div><div class="who" id="who">Finals 1448 · Industrial Engineering</div></div>
  <div class="count"><b id="cnum">–</b><span id="clab"></span></div></div>
  <div class="ribbon" id="ribbon" aria-label="Study days, 23 Nov to 31 Dec"></div>
  <nav id="nav"><a href="#today" data-v="today">Today</a><a href="#plan" data-v="plan" data-f="plan">Plan</a><a href="#courses" data-v="courses">Courses</a><a href="#exams" data-v="exams">Exams</a><a href="#admin" data-v="admin" hidden>Members</a><button class="tbtn" id="theme">Theme</button><button class="tbtn" id="out" style="margin-left:6px">Sign out</button></nav>
</div></header>

<main class="wrap">
  <section class="view" id="v-today"></section>
  <section class="view" id="v-plan"></section>
  <section class="view" id="v-courses"></section>
  <section class="view" id="v-course"></section>
  <section class="view" id="v-exams"></section>
  <section class="view" id="v-admin"></section>
  <footer id="foot">Built from your lecture files and posters.</footer>
</main>

<div class="viewer" id="labv" role="dialog" aria-modal="true"><div class="vbar"><b>CAM Practice Lab</b><button class="vbtn" id="lx">Close</button></div><iframe id="lf" title="CAM Practice Lab" style="flex:1;border:0;background:#fff"></iframe></div>
<div class="viewer" id="viewer" role="dialog" aria-modal="true"><div class="vbar"><b id="vt"></b><div style="display:flex;gap:8px"><button class="vbtn" id="vz">Zoom</button><button class="vbtn" id="vx">Close</button></div></div><div class="vimg" id="vimg"></div></div>

<script>
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
(function(){const t=store.get('theme',null);if(t)document.documentElement.dataset.theme=t;document.getElementById('theme').onclick=()=>{const c=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');const n=c==='dark'?'light':'dark';document.documentElement.dataset.theme=n;store.set('theme',n)}})();
/* ===== shell: everything before sign-in. All study content is encrypted below and only opens with a valid account. ===== */
const te=new TextEncoder(),td=new TextDecoder();
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const unhex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
const rnd=n=>hex(crypto.getRandomValues(new Uint8Array(n)));
const b64e=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/=+$/,'');
const b64d=t=>JSON.parse(decodeURIComponent(escape(atob(t.replace(/\s+/g,'')))));
const u8=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
const tob64=b=>{let s='';const a=new Uint8Array(b);for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s)};
const val=id=>document.getElementById(id).value.trim();
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function copyTxt(b,t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{b.textContent='Copied'},()=>{b.textContent='Select the code and copy it'})}
const FEATURE_KEYS=['plan','lab','c-cam','c-doe','c-fp','c-saf','c-rob'];

async function aesKey(raw){return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt'])}
async function seal(raw,bytes){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await aesKey(raw),bytes);const o=new Uint8Array(12+ct.byteLength);o.set(iv);o.set(new Uint8Array(ct),12);return tob64(o)}
async function open_(raw,b64){const a=u8(b64);return crypto.subtle.decrypt({name:'AES-GCM',iv:a.slice(0,12)},await aesKey(raw),a.slice(12))}
async function pwKey(pw,salt){const k=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:unhex(salt),iterations:250000},k,256))}
async function masterBytes(mk){return new Uint8Array(await crypto.subtle.digest('SHA-256',te.encode(mk.toUpperCase().replace(/[^0-9A-Z]/g,''))))}
async function hk(M,name){const k=await crypto.subtle.importKey('raw',M,'HKDF',false,['deriveBits']);return hex(await crypto.subtle.deriveBits({name:'HKDF',hash:'SHA-256',salt:te.encode('studyhub-v1'),info:te.encode(name)},k,256))}
async function allKeys(M){const o={core:await hk(M,'core')};for(const f of FEATURE_KEYS)if(f!=='plan')o[f]=await hk(M,f);return o}
const blob=id=>{const e=document.getElementById('E-'+id);return e?e.textContent.trim():null};

/* session state shared with the app */
let KEYS=null,MASTER=null;
const urlCache={};
async function imgURL(c,id){if(urlCache[id])return urlCache[id];const k=KEYS&&KEYS['c-'+c];if(!k)throw 0;const r=await fetch('p/'+id+'.bin',{cache:'force-cache'});if(!r.ok)throw 0;const a=new Uint8Array(await r.arrayBuffer());const b=await crypto.subtle.decrypt({name:'AES-GCM',iv:a.slice(0,12)},await aesKey(unhex(k)),a.slice(12));return urlCache[id]=URL.createObjectURL(new Blob([b],{type:'image/webp'}))}
async function openLab(){if(!KEYS||!KEYS.lab)return;const L=document.getElementById('labv'),f=document.getElementById('lf');f.srcdoc=td.decode(await open_(unhex(KEYS.lab),blob('lab')));L.classList.add('on')}
document.getElementById('lx').onclick=()=>{document.getElementById('labv').classList.remove('on');document.getElementById('lf').srcdoc=''};

let coreLoaded=false;
async function boot(acct,u,keys,master){
 const code=td.decode(await open_(unhex(keys.core),blob('core')));
 KEYS=keys;MASTER=master||null;
 if(!coreLoaded){const s=document.createElement('script');s.textContent=code;document.body.appendChild(s);coreLoaded=true}
 APP.boot({me:u,meName:acct.n,isOwner:acct.role==='owner',perms:acct.role==='owner'?null:(acct.f||{})});
 document.body.classList.remove('locked');scrollTo({top:0});
}

const G=document.getElementById('gcard');
function gate(mode,msg){
 const err=`<div class="gerr" id="gErr">${msg||''}</div>`;
 const links=(...ls)=>`<div class="glinks">${ls.map(([m,t])=>`<button type="button" data-g="${m}">${t}</button>`).join('')}</div>`;
 if(mode==='in')G.innerHTML=`<h2>Sign in</h2><form id="gF"><label class="fld"><span>Username</span><input id="gU" autocomplete="username" autocapitalize="none" required></label><label class="fld"><span>Password</span><input id="gP" type="password" autocomplete="current-password" required></label><button class="gbtn">Sign in</button>${err}</form>${links(['code','I have an invite code'],['owner','Owner setup'],['restore','Restore a backup'])}`;
 if(mode==='code')G.innerHTML=`<h2>Add your invite code</h2><p class="lede">Paste the code you were sent. You only do this once on each device.</p><form id="gF"><label class="fld"><span>Invite code</span><textarea id="gC" required></textarea></label><button class="gbtn">Add account</button>${err}</form>${links(['in','Back to sign in'])}`;
 if(mode==='owner')G.innerHTML=`<h2>Owner setup</h2><p class="lede">Create the owner account on this device. You need the master key.</p><form id="gF"><label class="fld"><span>Master key</span><input id="gK" autocomplete="off" autocapitalize="characters" required></label><label class="fld"><span>Your name</span><input id="gN" value="Mohammed Mansaki" required></label><label class="fld"><span>Username</span><input id="gU" autocomplete="username" autocapitalize="none" required></label><label class="fld"><span>Password (at least 6 characters)</span><input id="gP" type="password" autocomplete="new-password" required></label><label class="fld"><span>Repeat password</span><input id="gP2" type="password" autocomplete="new-password" required></label><button class="gbtn">Create owner account</button>${err}</form>${links(['in','Back to sign in'])}`;
 if(mode==='restore')G.innerHTML=`<h2>Restore a backup</h2><p class="lede">Paste the backup you copied from the Members page on your other device.</p><form id="gF"><label class="fld"><span>Backup</span><textarea id="gC" required></textarea></label><button class="gbtn">Restore</button>${err}</form>${links(['in','Back to sign in'])}`;
 G.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>gate(b.dataset.g));
 const F=document.getElementById('gF'),E=()=>document.getElementById('gErr'),btn=F.querySelector('.gbtn');
 F.onsubmit=async e=>{e.preventDefault();const acc=store.get('accounts',{});btn.disabled=true;const lab=btn.textContent;btn.textContent='Checking…';
  try{
  if(mode==='in'){const u=val('gU').toLowerCase().replace(/\s+/g,''),p=document.getElementById('gP').value,a=acc[u];
   if(!a){E().textContent=Object.keys(acc).length?'Wrong username or password.':'No account on this device yet. Add your invite code first.';return}
   let keys,master=null;
   try{const plain=await open_(await pwKey(p,a.s),a.ct);
    if(a.role==='owner'){master=new Uint8Array(plain);keys=await allKeys(master)}else keys=JSON.parse(td.decode(plain))}
   catch(x){E().textContent='Wrong username or password.';return}
   store.set('sess',{u,keys,m:master?hex(master):null});await boot(a,u,keys,master)}
  if(mode==='code'){const t=val('gC');if(!t.startsWith('SSH2.'))throw 0;const m=b64d(t.slice(5));if(!m.u||!m.ct)throw 0;
   if(acc[m.u]&&acc[m.u].role==='owner'){E().textContent='This username belongs to the owner on this device.';return}
   if(acc[m.u]&&acc[m.u].ts>m.ts){E().textContent='This device already has a newer code for @'+m.u+'.';return}
   acc[m.u]={role:'member',n:m.n,s:m.s,ct:m.ct,f:m.f,ts:m.ts};store.set('accounts',acc);gate('in','<span class="gok">Account @'+esc(m.u)+' added. Sign in with your password.</span>');document.getElementById('gU').value=m.u}
  if(mode==='owner'){const M=await masterBytes(val('gK')),keys=await allKeys(M);
   try{await open_(unhex(keys.core),blob('core'))}catch(x){E().textContent='That master key is not right.';return}
   const u=val('gU').toLowerCase().replace(/\s+/g,''),p=document.getElementById('gP').value;
   if(!u||p.length<6){E().textContent='Choose a username and a password of 6+ characters.';return}
   if(p!==document.getElementById('gP2').value){E().textContent='The two passwords don’t match.';return}
   const s=rnd(16),a={role:'owner',n:val('gN')||'Owner',s,ct:await seal(await pwKey(p,s),M),ts:Date.now()};acc[u]=a;store.set('accounts',acc);
   store.set('sess',{u,keys,m:hex(M)});await boot(a,u,keys,M)}
  if(mode==='restore'){const t=val('gC');if(!t.startsWith('SSHB2.'))throw 0;const b=b64d(t.slice(6));
   acc[b.u]=b.o;store.set('accounts',acc);store.set('members',b.m||[]);if(b.d)store.set('done:'+b.u,b.d);gate('in','<span class="gok">Backup restored. Sign in as @'+esc(b.u)+'.</span>');document.getElementById('gU').value=b.u}
  }catch(x){E().textContent=mode==='in'?'Something went wrong. Try again.':'That code isn’t valid. Copy the whole code and try again.'}
  finally{if(document.body.contains(btn)){btn.disabled=false;btn.textContent=lab}}};
 const f=G.querySelector('input,textarea');if(f&&!f.value)f.focus();
}
document.getElementById('out').onclick=()=>{store.set('sess',null);location.hash='';location.reload()};
addEventListener('DOMContentLoaded',async()=>{const s=store.get('sess',null),acc=store.get('accounts',{});
 if(s&&acc[s.u]&&s.keys){try{await boot(acc[s.u],s.u,s.keys,s.m?unhex(s.m):null);return}catch(e){store.set('sess',null)}}
 gate('in');const h=location.hash.match(/(?:^#|&)(?:join|invite)=([^&]+)/);if(h){gate('code');document.getElementById('gC').value=decodeURIComponent(h[1])}});

</script>
